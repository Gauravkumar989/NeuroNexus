<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Employee Information Form</title>
    <style>
        :root {
            --primary-color: #4285F4;
            --primary-hover: #3367D6;
            --error-color: #d32f2f;
            --border-color: #dadce0;
            --focus-color: #8ab4f8;
            --background-color: #f8f9fa;
            --form-background: #ffffff;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            background-color: var(--background-color);
            margin: 0;
            padding: 40px 20px;
            color: #202124;
            line-height: 1.5;
        }
        
        .form-wrapper {
            max-width: 640px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease-out;
        }
        
        .form-container {
            background-color: var(--form-background);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        
        .form-header {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
        }
        
        .form-header h1 {
            color: var(--primary-color);
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .form-header p {
            color: #5f6368;
            font-size: 14px;
        }
        
        .form-header::after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), #34a853, #fbbc05, #ea4335);
            margin: 16px auto 0;
            border-radius: 3px;
        }
        
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #202124;
        }
        
        .required::after {
            content: " *";
            color: var(--error-color);
        }
        
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
            transition: border 0.2s ease, box-shadow 0.2s ease;
            background-color: var(--form-background);
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.2);
            outline: none;
        }
        
        textarea {
            height: 120px;
            resize: vertical;
            min-height: 100px;
        }
        
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235f6368'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
            padding-right: 36px;
        }
        
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            position: relative;
        }
        
        .radio-option input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .radio-custom {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            margin-right: 8px;
            position: relative;
            transition: border-color 0.2s ease;
        }
        
        .radio-option input:checked ~ .radio-custom {
            border-color: var(--primary-color);
        }
        
        .radio-custom::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--primary-color);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .radio-option input:checked ~ .radio-custom::after {
            opacity: 1;
        }
        
        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            width: 100%;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .submit-btn:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .submit-btn:active {
            background-color: #2a56c6;
        }
        
        .form-footer {
            text-align: center;
            color: #5f6368;
            font-size: 12px;
            margin-top: 20px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 600px) {
            .form-container {
                padding: 30px 20px;
            }
            
            .radio-group {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="form-wrapper">
        <div class="form-container">
            <div class="form-header">
                <h1>Employee Information Form</h1>
                <p>Please fill out all required fields</p>
            </div>
            
            <form action="#" method="post">
                <div class="form-group">
                    <label for="fullname" class="required">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label for="email" class="required">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="example@company.com">
                </div>
                
                <div class="form-group">
                    <label for="phone">Contact Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+1 (123) 456-7890">
                </div>
                
                <div class="form-group">
                    <label for="company" class="required">Company Name</label>
                    <input type="text" id="company" name="company" required placeholder="Your company name">
                </div>
                
                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department" name="department">
                        <option value="" disabled selected>Select your department</option>
                        <option value="HR">Human Resources (HR)</option>
                        <option value="Sales">Sales</option>
                        <option value="Development">Development</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Finance">Finance</option>
                        <option value="Operations">Operations</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Gender</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" id="male" name="gender" value="male">
                            <span class="radio-custom"></span>
                            <span>Male</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" id="female" name="gender" value="female">
                            <span class="radio-custom"></span>
                            <span>Female</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" id="no-say" name="gender" value="no-say">
                            <span class="radio-custom"></span>
                            <span>Prefer not to say</span>
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" placeholder="Enter your full address"></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Submit Information</button>
            </form>
        </div>
        
        <div class="form-footer">
            <p>All information provided will be kept confidential</p>
        </div>
    </div>
</body>
</html>
